[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k12-misconception-mlops"
version = "0.1.0"
description = "A learning-first, non-public end-to-end MLOps sandbox for the CoLearn Kaggle challenge"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "Pillow>=10,<13",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
tracking = ["mlflow>=3,<5", "dvc>=3,<5"]
orchestration = ["prefect>=3,<4"]
serving = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
monitoring = ["evidently>=0.7,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
exclude = ["data", "reports", "logs", "models", ".conda"]
